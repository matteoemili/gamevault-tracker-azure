  description: Per-instance Azure Static Web App provisioned by infra/main.bicep to host the Vite frontend from dist.
  annotations:
    github.com/project-slug: matteoemili/gamevault-tracker-azure
  tags:
    - azure
    - static-web-apps
    - hosting
    - multi-instance
spec:
  type: static-site
  system: gamevault-tracker-azure
  lifecycle: production
  owner: user:default/matteoemili
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: gamevault-tracker-azure-table-storage
  description: Per-instance Azure Storage Account Table Service with games and categories tables and browser CORS rules.
  annotations:
    github.com/project-slug: matteoemili/gamevault-tracker-azure
  tags:
    - azure
    - storage
    - table-storage
    - multi-instance
spec:
  type: database
  system: gamevault-tracker-azure
  lifecycle: production
  owner: user:default/matteoemili
