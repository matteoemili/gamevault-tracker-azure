apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: gamevault-tracker-azure-iac
  description: Bicep infrastructure for isolated GameVault instances and the shared Azure Front Door entry platform that publishes their routes.
  annotations:
    github.com/project-slug: matteoemili/gamevault-tracker-azure
  tags:
    - azure
    - bicep
    - iac
    - multi-instance
    - azure-front-door
    - observability
  links:
    - url: https://github.com/matteoemili/gamevault-tracker-azure
      title: Source Code
      icon: github
    - url: https://github.com/matteoemili/gamevault-tracker-azure/tree/main/infra
      title: Bicep Templates
      icon: docs
    - url: https://github.com/matteoemili/gamevault-tracker-azure/blob/main/docs/INFRASTRUCTURE.md
      title: Infrastructure Documentation
      icon: docs
    - url: https://github.com/matteoemili/gamevault-tracker-azure/blob/main/scripts/deploy-infra.sh
      title: Instance Deployment Script
      icon: docs
spec:
  type: iac
  system: gamevault-tracker-azure
  lifecycle: production
  owner: user:default/matteoemili
  dependsOn:
    - resource:default/gamevault-tracker-azure-static-web-app
    - resource:default/gamevault-tracker-azure-table-storage
    - resource:default/gamevault-tracker-azure-front-door
    - resource:default/gamevault-tracker-azure-front-door-waf
    - resource:default/gamevault-tracker-azure-front-door-routes
    - resource:default/gamevault-tracker-azure-maintenance-origin-storage
    - resource:default/gamevault-tracker-azure-log-analytics
    - resource:default/gamevault-tracker-azure-platform-observability
    - resource:default/gamevault-tracker-azure-platform-budget
    - resource:default/gamevault-tracker-azure-platform-rbac
---
