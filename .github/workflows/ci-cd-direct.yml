name: Instance deployment without Front Door

# Simplified sibling of ci-cd.yml. It deploys the same instance infrastructure
# and application, but publishes the Static Web App hostname directly instead of
# registering a route on the shared Front Door profile.
#
# Exactly one deployment pipeline is active at a time:
#   vars.FRONT_DOOR_PUBLICATION_ENABLED == 'true' -> ci-cd.yml
#   otherwise (default)                           -> this workflow
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      instance_id:
        description: 'Instance ID for deployment (leave empty to generate new, or provide existing ID to redeploy)'
        required: false
        type: string
        default: ''
      environment:
        description: 'Environment to deploy'
        required: false
        type: choice
        options:
          - prod
          - dev
          - staging
        default: 'prod'

env:
  AZURE_LOCATION: westeurope
  BICEP_FILE: infra/main.bicep

jobs:
  # ============================================================================
  # Infrastructure Deployment Job
  # ============================================================================
  deploy_infrastructure:
    if: vars.FRONT_DOOR_PUBLICATION_ENABLED != 'true' && (github.event_name != 'pull_request' || github.event.action != 'closed' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    name: Deploy Infrastructure (Direct)
    outputs:
      instanceId: ${{ steps.set_instance.outputs.instanceId }}
      resourceGroup: ${{ steps.set_instance.outputs.resourceGroup }}
      environment: ${{ steps.set_instance.outputs.environment }}
      storageAccountName: ${{ steps.deploy.outputs.storageAccountName }}
      staticWebAppName: ${{ steps.deploy.outputs.staticWebAppName }}
      staticWebAppDefaultHostname: ${{ steps.deploy.outputs.staticWebAppDefaultHostname }}
      staticWebAppUrl: ${{ steps.deploy.outputs.staticWebAppUrl }}
      gamesTableName: ${{ steps.deploy.outputs.gamesTableName }}
      categoriesTableName: ${{ steps.deploy.outputs.categoriesTableName }}
    concurrency:
      # Shared with ci-cd.yml so the two pipelines can never mutate the same
      # instance resources at the same time.
      group: instance-infrastructure-${{ github.event.inputs.instance_id || github.event.pull_request.number || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Determine Instance ID and Environment
        id: set_instance
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_INSTANCE_ID: ${{ inputs.instance_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./scripts/pipeline/infrastructure/determine-instance.sh

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_SPONSORSHIP }}

      - name: Create Resource Group
        run: ./scripts/pipeline/infrastructure/create-resource-group.sh

      - name: Deploy Infrastructure
        id: deploy
        run: ./scripts/pipeline/infrastructure/deploy-infrastructure.sh

      - name: Configure Storage CORS
        env:
          STORAGE_ACCOUNT: ${{ steps.deploy.outputs.storageAccountName }}
          WEB_APP_URL: ${{ steps.deploy.outputs.staticWebAppUrl }}
        run: ./scripts/pipeline/infrastructure/configure-storage-cors.sh

      - name: Display Deployment Summary
        env:
          INSTANCE_ID: ${{ steps.deploy.outputs.instanceId }}
          STATIC_WEB_APP: ${{ steps.deploy.outputs.staticWebAppName }}
          STORAGE_ACCOUNT: ${{ steps.deploy.outputs.storageAccountName }}
          STATIC_WEB_APP_URL: ${{ steps.deploy.outputs.staticWebAppUrl }}
        run: ./scripts/pipeline/infrastructure/display-deployment-summary.sh

  # ============================================================================
  # Build, Deploy and Publish Job
  # ============================================================================
  build_and_deploy_job:
    if: vars.FRONT_DOOR_PUBLICATION_ENABLED != 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    name: Build and Deploy Job (Direct)
    needs: deploy_infrastructure
    outputs:
      staticWebAppOriginHostname: ${{ steps.validate_swa.outputs.deployedHostname }}
      publishedUrl: ${{ steps.publish_result.outputs.publishedUrl }}
    concurrency:
      group: instance-route-${{ needs.deploy_infrastructure.outputs.instanceId }}
      cancel-in-progress: false
    env:
      INSTANCE_ID: ${{ needs.deploy_infrastructure.outputs.instanceId }}
      STATIC_WEB_APP: ${{ needs.deploy_infrastructure.outputs.staticWebAppName }}
      STATIC_WEB_APP_DEFAULT_HOSTNAME: ${{ needs.deploy_infrastructure.outputs.staticWebAppDefaultHostname }}
      STORAGE_ACCOUNT: ${{ needs.deploy_infrastructure.outputs.storageAccountName }}
      AZURE_RESOURCE_GROUP: ${{ needs.deploy_infrastructure.outputs.resourceGroup }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_SPONSORSHIP }}

      - name: Generate SAS Token
        id: generate_sas
        run: ./scripts/pipeline/application/generate-sas-token.sh

      - name: Get SWA Deployment Token
        id: get_token
        run: ./scripts/pipeline/application/get-swa-deployment-token.sh

      - name: Create Production Environment File
        env:
          VITE_AZURE_STORAGE_ACCOUNT_NAME: ${{ needs.deploy_infrastructure.outputs.storageAccountName }}
          VITE_AZURE_STORAGE_SAS_TOKEN: ${{ steps.generate_sas.outputs.sas_token }}
          VITE_AZURE_GAMES_TABLE_NAME: ${{ needs.deploy_infrastructure.outputs.gamesTableName }}
          VITE_AZURE_CATEGORIES_TABLE_NAME: ${{ needs.deploy_infrastructure.outputs.categoriesTableName }}
        run: ./scripts/pipeline/application/create-production-environment-file.sh

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.get_token.outputs.swa_token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "/"
          api_location: ""
          output_location: "dist"
          production_branch: ${{ github.base_ref || github.ref_name }}
          ###### End of Repository/Build Configurations ######

      - name: Validate Static Web App Deployment
        id: validate_swa
        env:
          DEPLOYED_URL: ${{ steps.builddeploy.outputs.static_web_app_url }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./scripts/pipeline/application/validate-static-web-app-deployment.sh

      - name: Configure Static Web App Settings
        env:
          VITE_AZURE_STORAGE_ACCOUNT_NAME: ${{ needs.deploy_infrastructure.outputs.storageAccountName }}
          VITE_AZURE_STORAGE_SAS_TOKEN: ${{ steps.generate_sas.outputs.sas_token }}
          VITE_AZURE_GAMES_TABLE_NAME: ${{ needs.deploy_infrastructure.outputs.gamesTableName }}
          VITE_AZURE_CATEGORIES_TABLE_NAME: ${{ needs.deploy_infrastructure.outputs.categoriesTableName }}
        run: ./scripts/pipeline/application/configure-static-web-app-settings.sh

      - name: Align Deployed Origin CORS
        env:
          DEPLOYED_HOSTNAME: ${{ steps.validate_swa.outputs.deployedHostname }}
        run: ./scripts/pipeline/direct/align-deployed-origin-cors.sh

      - name: Report Published Static Web App
        id: publish_result
        env:
          DEPLOYED_HOSTNAME: ${{ steps.validate_swa.outputs.deployedHostname }}
        run: ./scripts/pipeline/direct/report-direct-deployment.sh

      - name: Retain Direct Publication Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-publication-${{ needs.deploy_infrastructure.outputs.instanceId }}
          if-no-files-found: warn
          path: direct-publication-result.json

  # ============================================================================
  # Close Pull Request Job
  # ============================================================================
  close_pull_request_job:
    if: vars.FRONT_DOOR_PUBLICATION_ENABLED != 'true' && github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job (Direct)
    steps:
      - uses: actions/checkout@v4

      - name: Determine PR Instance
        id: pr_instance
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./scripts/pipeline/pull-request/determine-instance.sh

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_SPONSORSHIP }}

      - name: Find and Close Staging Environment
        id: find_swa
        env:
          RESOURCE_GROUP: ${{ steps.pr_instance.outputs.resourceGroup }}
        run: ./scripts/pipeline/pull-request/find-static-web-app.sh

      - name: Close Pull Request
        if: steps.find_swa.outputs.found == 'true'
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.find_swa.outputs.swa_token }}
          action: "close"

      - name: Delete PR Resource Group
        if: steps.pr_instance.outputs.resourceGroup != ''
        env:
          RESOURCE_GROUP: ${{ steps.pr_instance.outputs.resourceGroup }}
        run: ./scripts/pipeline/pull-request/delete-resource-group.sh
