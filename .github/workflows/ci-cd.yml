name: Shared service deployment

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: false
        type: choice
        options:
          - prod
          - dev
          - staging
        default: 'prod'

env:
  AZURE_LOCATION: westeurope
  DEPLOYMENT_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
  VITE_AZURE_GAMES_TABLE_NAME: games
  VITE_AZURE_CATEGORIES_TABLE_NAME: categories

jobs:
  pr_validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Pull Request Build and Offline Contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Run Offline Contracts
        run: |
          ./scripts/shared-service.sh validate --environment dev --local-only >/dev/null
          bash tests/infrastructure/contracts/offline-validation.sh

  shared_deployment:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Deploy Shared Service
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
    outputs:
      sharedPublicUrl: ${{ steps.report_shared.outputs.sharedPublicUrl }}
      publishedUrl: ${{ steps.report_shared.outputs.publishedUrl }}
      environment: ${{ steps.resolve_shared.outputs.environment }}
    concurrency:
      group: shared-service-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
      cancel-in-progress: false
    env:
      SHARED_RESOURCE_GROUP_DEV: ${{ secrets.GAMEVAULT_SHARED_RESOURCE_GROUP_DEV }}
      SHARED_RESOURCE_GROUP_STAGING: ${{ secrets.GAMEVAULT_SHARED_RESOURCE_GROUP_STAGING }}
      SHARED_RESOURCE_GROUP_PROD: ${{ secrets.GAMEVAULT_SHARED_RESOURCE_GROUP_PROD }}
      PLATFORM_RESOURCE_GROUP_DEV: ${{ secrets.GAMEVAULT_PLATFORM_RESOURCE_GROUP_DEV }}
      PLATFORM_RESOURCE_GROUP_STAGING: ${{ secrets.GAMEVAULT_PLATFORM_RESOURCE_GROUP_STAGING }}
      PLATFORM_RESOURCE_GROUP_PROD: ${{ secrets.GAMEVAULT_PLATFORM_RESOURCE_GROUP_PROD }}
      FRONT_DOOR_PROFILE_DEV: ${{ secrets.GAMEVAULT_SHARED_FRONT_DOOR_PROFILE_DEV || secrets.GAMEVAULT_FRONT_DOOR_PROFILE_DEV }}
      FRONT_DOOR_PROFILE_STAGING: ${{ secrets.GAMEVAULT_SHARED_FRONT_DOOR_PROFILE_STAGING || secrets.GAMEVAULT_FRONT_DOOR_PROFILE_STAGING }}
      FRONT_DOOR_PROFILE_PROD: ${{ secrets.GAMEVAULT_SHARED_FRONT_DOOR_PROFILE_PROD || secrets.GAMEVAULT_FRONT_DOOR_PROFILE_PROD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Initialize Shared Publication Result
        run: ./scripts/pipeline/shared-service/initialize-shared-result.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Offline Contracts
        run: |
          npm run build
          ./scripts/shared-service.sh validate --environment "$DEPLOYMENT_ENVIRONMENT" --local-only >/dev/null
          bash tests/infrastructure/contracts/offline-validation.sh

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_SPONSORSHIP }}

      - name: Resolve Azure Subscription
        run: echo "SUBSCRIPTION_ID=$(az account show --query id -o tsv)" >> "$GITHUB_ENV"

      - name: Resolve Shared Service Configuration
        id: resolve_shared
        run: ./scripts/pipeline/shared-service/resolve-shared-configuration.sh

      - name: Validate, What-If, and Deploy Shared Service
        id: deploy_shared
        run: ./scripts/pipeline/shared-service/deploy-shared-service.sh

      - name: Generate SAS Token
        id: generate_sas
        run: ./scripts/pipeline/application/generate-sas-token.sh

      - name: Get SWA Deployment Token
        id: get_token
        run: ./scripts/pipeline/application/get-swa-deployment-token.sh

      - name: Create Production Environment File
        env:
          VITE_AZURE_STORAGE_ACCOUNT_NAME: ${{ steps.deploy_shared.outputs.storageAccountName }}
          VITE_AZURE_STORAGE_SAS_TOKEN: ${{ steps.generate_sas.outputs.sas_token }}
          VITE_AZURE_GAMES_TABLE_NAME: ${{ env.VITE_AZURE_GAMES_TABLE_NAME }}
          VITE_AZURE_CATEGORIES_TABLE_NAME: ${{ env.VITE_AZURE_CATEGORIES_TABLE_NAME }}
        run: ./scripts/pipeline/application/create-production-environment-file.sh

      - name: Build And Deploy Shared Application
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.get_token.outputs.swa_token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "dist"
          production_branch: ${{ github.ref_name }}

      - name: Validate Shared Static Web App Deployment
        id: validate_swa
        env:
          DEPLOYED_URL: ${{ steps.builddeploy.outputs.static_web_app_url }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ''
        run: ./scripts/pipeline/application/validate-static-web-app-deployment.sh

      - name: Configure Static Web App Settings
        env:
          VITE_AZURE_STORAGE_ACCOUNT_NAME: ${{ steps.deploy_shared.outputs.storageAccountName }}
          VITE_AZURE_STORAGE_SAS_TOKEN: ${{ steps.generate_sas.outputs.sas_token }}
          VITE_AZURE_GAMES_TABLE_NAME: ${{ env.VITE_AZURE_GAMES_TABLE_NAME }}
          VITE_AZURE_CATEGORIES_TABLE_NAME: ${{ env.VITE_AZURE_CATEGORIES_TABLE_NAME }}
        run: ./scripts/pipeline/application/configure-static-web-app-settings.sh

      - name: Verify Shared Service
        run: ./scripts/pipeline/shared-service/verify-shared-service.sh

      - name: Report Shared Service
        id: report_shared
        run: ./scripts/pipeline/shared-service/report-shared-service.sh

      - name: Retain Shared Service Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-service-${{ env.DEPLOYMENT_ENVIRONMENT }}-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            shared-publication-result.json
            shared-validation.json
            shared-what-if.json
            shared-deployment.json
            shared-route-verification.json
            shared-inventory-before.json
            shared-inventory-after.json
            shared-forwarding-gateway.json
            public/staticwebapp.config.json
            dist/staticwebapp.config.json
